  <!-- Bow -->
  <circle cx="23" cy="26" r="1.5" fill="#f4ebd9" stroke="#a38257" stroke-width="0.5" />

  <!-- Green Cinnamon Leaf -->
  <path d="M 15 28 C 11 25, 10 21, 14 20 C 18 20, 18 24, 16 27 Z" fill="#16a34a" stroke="#14532d" stroke-width="0.6" />
  <path d="M 12 21 L 16 26" stroke="#4ade80" stroke-width="0.5" fill="none" />
</svg>
