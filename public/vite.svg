  <!-- Shadow -->
  <ellipse cx="24" cy="38" rx="14" ry="3" fill="#e8dacf" opacity="0.6" />
  
  <!-- Cinnamon Stick 1 (Diagonal Left to Right) -->
  <path d="M 14 36 L 31 15 L 35 18 L 18 39 Z" fill="#9a3412" stroke="#7c2d12" stroke-width="0.75" />
  <path d="M 16 35 L 32 16 L 33 17 L 17 36 Z" fill="#c2410c" />
  <!-- Curl 1 -->
  <ellipse cx="33" cy="16.5" rx="2.5" ry="3" fill="#ea580c" stroke="#7c2d12" stroke-width="0.75" />
  <path d="M 32 15.5 C 33.5 15, 34 16.5, 33 17.5" stroke="#431407" stroke-width="0.75" fill="none" />

  <!-- Cinnamon Stick 2 (Crossing) -->
  <path d="M 20 38 L 26 12 L 30 13 L 24 39 Z" fill="#b45309" stroke="#78350f" stroke-width="0.75" />
  <path d="M 21.5 37 L 27 13 L 28 13.5 L 22.5 37.5 Z" fill="#d97706" />
