  <ellipse cx="28" cy="12.5" rx="2.2" ry="2.6" fill="#f59e0b" stroke="#78350f" stroke-width="0.75" />
  <path d="M 27.2 11.8 C 28.5 11.5, 29 12.8, 28 13.5" stroke="#451a03" stroke-width="0.75" fill="none" />

  <!-- Raffia / Twine wrap -->
