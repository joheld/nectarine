<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" fill="none">
  <defs>
    <linearGradient id="barkA" x1="6" y1="28" x2="26" y2="6" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#78350f"/>
      <stop offset="40%" stop-color="#b44b10"/>
      <stop offset="70%" stop-color="#c2410c"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>
    <linearGradient id="barkB" x1="10" y1="28" x2="22" y2="4" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#7c2d12"/>
      <stop offset="50%" stop-color="#9a3412"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="scrollInner" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fef3c7"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <linearGradient id="twine" x1="11" y1="18" x2="19" y2="15" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#fef3c7"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <filter id="softShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="1" stdDeviation="0.8" flood-color="#451a03" flood-opacity="0.25"/>
    </filter>
  </defs>

  <g filter="url(#softShadow)">
    <!-- Quill 2 (Behind) -->
    <path d="M 13.5 28.5 L 20 7.5 C 20.3 6.5 22.2 6.5 22.8 7.5 L 16.5 29 C 15.8 29.5 14 29.2 13.5 28.5 Z" 
          fill="url(#barkB)"/>
    <ellipse cx="21.2" cy="7.2" rx="1.8" ry="1.3" transform="rotate(20 21.2 7.2)" fill="url(#scrollInner)" stroke="#78350f" stroke-width="0.5"/>
    <path d="M 20.4 7.2 C 20.6 6.6 21.8 6.5 22 7.1 C 22.1 7.6 21.4 7.8 21.1 7.5 C 20.9 7.3 21.2 7 21.4 7.1" 
          stroke="#451a03" stroke-width="0.4" fill="none" stroke-linecap="round"/>

    <!-- Quill 1 (Foreground, crossing) -->
    <path d="M 7.5 24.5 L 23.5 8.5 C 24.4 7.6 26.2 8.4 25.8 9.8 L 10.2 26.5 C 9.2 27.2 7.5 26 7.5 24.5 Z" 
          fill="url(#barkA)"/>
    <!-- Bark Highlight Rim -->
    <path d="M 8.8 24.8 L 24.2 9.2" stroke="#fed7aa" stroke-width="0.6" stroke-linecap="round" opacity="0.65"/>
    <!-- Bark Texture Grooves -->
    <path d="M 10.5 23.5 L 21 13" stroke="#7c2d12" stroke-width="0.4" opacity="0.5"/>

    <!-- Scroll 1 Top (End cross-section of Ceylon cinnamon quill) -->
    <ellipse cx="24.6" cy="9.1" rx="2.2" ry="1.5" transform="rotate(45 24.6 9.1)" fill="url(#scrollInner)" stroke="#7c2d12" stroke-width="0.6"/>
    <!-- Concentric spiral roll of cinnamon bark -->
    <path d="M 23.4 9.4 C 23.6 8.3 25.4 8.2 25.6 9.2 C 25.7 10 24.5 10.4 24.1 9.8 C 23.8 9.3 24.4 8.8 24.8 9" 
          stroke="#451a03" stroke-width="0.5" fill="none" stroke-linecap="round"/>

    <!-- Twine Wrap Binding the Sticks -->
    <path d="M 13.8 19.8 C 14.5 18 17.5 16.5 18.8 15.5" stroke="url(#twine)" stroke-width="1.4" stroke-linecap="round" fill="none"/>
    <path d="M 14.2 20.8 C 15 19 18 17.5 19.2 16.5" stroke="#b45309" stroke-width="0.5" stroke-linecap="round" fill="none"/>
    <!-- Knot -->
    <circle cx="16" cy="18" r="1" fill="#fef3c7" stroke="#b45309" stroke-width="0.5"/>
    <path d="M 16 18.8 C 15.8 20.5 15.2 21.5 14.8 22" stroke="#d97706" stroke-width="0.7" stroke-linecap="round" fill="none"/>
  </g>
</svg>