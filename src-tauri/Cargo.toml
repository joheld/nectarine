[package]
name = "vectura"
version = "0.1.0"
description = "Vectura — macOS Native Vector & Analytics Atelier"
authors = ["Antigravity Architecture"]
edition = "2021"

[lib]
name = "vectura_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-fs = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
